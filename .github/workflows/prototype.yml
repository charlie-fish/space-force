name: Prototype checks

on:
  push:
    branches: [main, 'prototype/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: space-force-static-prototype
          path: dist/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: space-force-local-prototype
          path: work/portable/
          retention-days: 14
